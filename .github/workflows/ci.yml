name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      # vet/test solo en paquetes sin CGO. Los CGO (internal/ui/*, y ./cmd
      # vía su import de internal/ui) necesitan headers X11/GL; se validan
      # en los jobs build.* de abajo.
      - name: Vet (non-CGO packages)
        run: go vet ./internal/core/... ./internal/config/... ./internal/logs/... ./internal/platform/...
      - name: Unit tests (non-CGO packages)
        run: go test ./internal/core/... ./internal/config/... ./internal/logs/...

  build:
    name: Build ${{ matrix.goos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install Linux deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgl1-mesa-dev xorg-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev \
            libayatana-appindicator3-dev
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          # En macOS, getlantern/systray genera duplicate-symbol errors con
          # el linker moderno de Xcode 15+. -ld_classic usa el linker previo
          # (bug: https://github.com/getlantern/systray/issues/317).
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            go build -ldflags "-extldflags=-Wl,-ld_classic" -o /dev/null ./cmd/navtunnel
          else
            go build -o /dev/null ./cmd/navtunnel
          fi
